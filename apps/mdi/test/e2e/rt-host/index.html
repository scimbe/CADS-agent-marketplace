<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; ">
<title>Test-Host Echtzeitkarten</title>
<style>
  :root { --paper: #fffaf0; --ink: #111; --hot: #b8200a; --yel: #ffd400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
  main { display: flex; flex-direction: column; min-height: 100dvh; max-width: 720px; margin: 0 auto; padding: 8px 12px 16px; gap: 8px; }
  h1 { font: 900 22px/1.1 Impact, "Anton", sans-serif; text-transform: uppercase; margin: 4px 0 0; }
  .rule { margin: 0; font-weight: 700; }
  .stagebox { position: relative; flex: 1 1 auto; min-height: 300px; height: 58dvh; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; background: #111; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  canvas:focus-visible { outline: 4px solid var(--yel); outline-offset: -4px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { min-height: 60px; min-width: 60px; padding: 0 18px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); font: 800 18px system-ui, sans-serif; }
  button.hot { background: var(--hot); color: #fff; }
  button.hold[aria-pressed=true] { background: var(--yel); }
  button:focus-visible, input:focus-visible { outline: 4px solid #1c2f7a; outline-offset: 2px; }
  #pause { position: absolute; right: 8px; top: 8px; background: var(--paper); }
  #result { border: 3px solid var(--ink); border-radius: 12px; padding: 12px; background: #fff; }
  #result[hidden], #pause[hidden], #link[hidden], #start[hidden] { display: none; }
  .score { font: 900 48px/1 Impact, sans-serif; margin: 0; }
  .slide { display: grid; grid-template-columns: 6em 1fr 6em; align-items: center; gap: 8px; font-weight: 700; }
  .slide input { width: 100%; min-height: 44px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  details { border: 2px solid var(--ink); border-radius: 10px; padding: 8px 12px; }
  summary { min-height: 44px; display: flex; align-items: center; font-weight: 800; cursor: pointer; }
  label.file { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
  input[type=text] { width: 100%; min-height: 44px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="rule" id="rule"></p>
  <p class="rule" id="ghostline"></p>
  <div class="stagebox">
    <canvas id="stage" role="img" tabindex="0" aria-label=""></canvas>
    <button id="pause" type="button" aria-label="Pause" hidden>⏸</button>
  </div>
  <p id="live" class="sr" aria-live="polite"></p>
  <div class="row" id="btns"><button id="start" type="button" class="hot">Los</button></div>
  <section id="result" hidden aria-labelledby="resscore">
    <p class="score" id="resscore"></p>
    <p id="resline"></p>
    <div class="row"><button id="again" type="button" class="hot">Nochmal</button><button id="challenge" type="button">Herausfordern</button></div>
    <label class="sr" for="link">Link</label><input id="link" type="text" readonly hidden>
  </section>
  <details><summary>Anpassen</summary>
    <div id="regler"></div>
    <label class="file">Eigenes Foto als Figur (bleibt auf diesem Gerät)<input id="foto-figur" type="file" accept="image/*"></label>
    <label class="file">Eigenes Foto als Hintergrund (bleibt auf diesem Gerät)<input id="foto-hintergrund" type="file" accept="image/*"></label>
  </details>
</main>
<script type="module" src="host.js"></script>
</body>
</html>
