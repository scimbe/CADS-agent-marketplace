name: CadsMarketplace
options:
  bundleIdPrefix: org.bunsenbrenner
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
targets:
  CadsMarketplace:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Generated            # created by build-rust.sh
      - path: ../../manifests/prompt-templates   # bundled signed sample templates (no copy)
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/MobileCoreFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bunsenbrenner.cads
        PRODUCT_NAME: CadsMarketplace
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CADS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CadsApiBase: https://bunsenbrenner.org
        INFOPLIST_KEY_CadsOidcIssuer: https://auth.bunsenbrenner.org/realms/ct-demo
        INFOPLIST_KEY_CadsOidcClientId: cads-mobile
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
    info:
      path: App/Info.plist
      properties:
        CadsApiBase: https://bunsenbrenner.org
        CadsOidcIssuer: https://auth.bunsenbrenner.org/realms/ct-demo
        CadsOidcClientId: cads-mobile
        CFBundleLocalizations: [de, en]
        UILaunchScreen: {}
