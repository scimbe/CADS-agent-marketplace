name: CadsMarketplace
options:
  bundleIdPrefix: org.bunsenbrenner
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # copy-duell.sh reads ../duell-web and writes into the bundle
targets:
  CadsMarketplace:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Generated            # created by build-rust.sh
      - path: ../../manifests/prompt-templates   # bundled signed sample templates (no copy)
        type: folder
        buildPhase: resources
    postCompileScripts:
      - name: Bundle Duell web game
        script: ./copy-duell.sh
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Frameworks/MobileCoreFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bunsenbrenner.cads
        PRODUCT_NAME: CadsMarketplace
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: My Daily Idea
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CadsApiBase: https://bunsenbrenner.org
        INFOPLIST_KEY_CadsOidcIssuer: https://auth.bunsenbrenner.org/realms/ct-demo
        INFOPLIST_KEY_CadsOidcClientId: cads-mobile
        CODE_SIGN_ENTITLEMENTS: App/CadsMarketplace.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
    info:
      path: App/Info.plist
      properties:
        CadsApiBase: https://bunsenbrenner.org
        CadsPeerFrontDoor: ""
        CadsPeerEdgeCaBase64: ""
        CadsPeerSni: ""
        CadsOidcIssuer: https://auth.bunsenbrenner.org/realms/ct-demo
        CadsOidcClientId: cads-mobile
        CFBundleLocalizations: [de, en]
        CFBundleDisplayName: My Daily Idea
        # Brand yellow from the first frame (colour set LaunchYellow in Assets.xcassets): the theme colour.
        UILaunchScreen:
          UIColorName: LaunchYellow
        # Asked only when the person taps record in the page / picks "Take Photo" in the photo sheet.
        # Texts are localized in Resources/*.lproj/InfoPlist.strings (these are the German defaults).
        NSMicrophoneUsageDescription: "My Daily Idea nimmt nur auf, wenn du in der Seite auf Aufnehmen tippst. Die Aufnahme bleibt auf dem Gerät."
        NSCameraUsageDescription: "My Daily Idea nutzt die Kamera nur, wenn du in der Fotoauswahl Foto aufnehmen wählst. Das Foto bleibt auf dem Gerät."
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/CadsMarketplace.entitlements
      properties:
        # Universal Link for https://bunsenbrenner.org/duell. Takes effect only in a build signed with
        # a team that has the Associated Domains capability (the CI simulator build is unsigned).
        com.apple.developer.associated-domains: ["applinks:bunsenbrenner.org"]
  # Pure logic (links, file rules): compiled straight into the test bundle, no host app and no Rust core needed.
  CadsMarketplaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: App/Duell/DuellLink.swift
      - path: App/Duell/DuellFiles.swift
      - path: App/Duell/PeerBridge.swift
      - path: App/Duell/DuellAi.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.bunsenbrenner.cads.tests
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
schemes:
  CadsMarketplace:
    build:
      targets:
        CadsMarketplace: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [CadsMarketplaceTests]
