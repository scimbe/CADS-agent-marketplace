<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; media-src blob:; connect-src https://demos-34a13a96.bunsenbrenner.org; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#ffd400">
<meta name="referrer" content="no-referrer">
<title>My Daily Idea</title>
<style>
/*@CSS@*/
</style>
</head>
<body data-state="home">
<div id="root">
  <section id="home" class="scr">
    <header class="bar">
      <h1 id="brand"></h1>
      <div class="mini"><button id="lang" aria-label="Sprache"></button><button id="mute" aria-label="Ton"></button><button id="host" aria-label="Mehr" hidden>⋯</button><button id="me" aria-label="Mein Stil"></button></div>
    </header>
    <div id="pad">
      <div class="under u2"></div><div class="under u1"></div>
      <article id="leaf">
        <div class="holes" aria-hidden="true"></div>
        <div class="dateline"><b id="dnum"></b><span id="dmon"></span><span id="dkind" class="burst"></span></div>
        <div id="hero"></div>
        <p id="teaser"></p>
        <p id="from" hidden></p>
      </article>
    </div>
    <button id="go" class="press"></button>
    <nav id="tools">
      <button id="more"></button><button id="own"></button><button id="past"></button><button id="wall"></button>
    </nav>
  </section>

  <section id="editor" class="scr" hidden>
    <header class="bar tight"><button id="edback" class="ico" aria-label="Zurück">←</button><div id="edtitle"></div><button id="edstyle" class="ico" aria-label="Mein Stil"></button></header>
    <div id="stagewrap"><canvas id="stage" width="540" height="675" aria-label="Vorschau"></canvas><div id="gamestage"><canvas id="demo" aria-label="Spielvorschau"></canvas></div></div>
    <div id="trail" hidden></div>
    <div id="tabs" role="tablist"></div>
    <div id="panel"></div>
    <div class="foot"><button id="edmain" class="press"></button></div>
    <input id="file" type="file" accept="image/*" hidden>
  </section>

  <section id="done" class="scr" hidden>
    <div id="donewrap"><img id="doneimg" alt=""></div>
    <div class="foot col">
      <button id="share" class="press"></button>
      <div class="row"><button id="save" class="btn"></button><button id="keep" class="btn"></button><button id="dhome" class="btn"></button></div>
    </div>
  </section>

  <section id="shelf" class="scr" hidden>
    <header class="bar tight"><button id="shback" class="ico" aria-label="Zurück">←</button><div id="shtitle"></div><span class="ico"></span></header>
    <div id="shbody"></div>
  </section>

  <section id="game" hidden>
    <canvas id="cv" aria-label="Spielfeld"></canvas>
    <div class="top"><button id="gback" class="ico" aria-label="Zurück">←</button><div id="title"></div></div>
    <div id="hud"><div id="score" data-score="0">0</div><div id="bestchip"></div></div>
    <div id="banner" hidden></div>
    <div id="hint"></div>
    <div id="dock"><button class="btn" id="remixbtn"></button></div>
    <div class="panel" id="result" aria-live="polite">
      <div id="record"></div><div id="res-score">0</div><div id="res-line"></div>
      <div id="gamebtns"><button class="btn" id="toremix"></button><button class="btn" id="challenge"></button></div>
      <div class="row"><button class="btn" id="again"></button><button class="btn" id="image"></button></div>
    </div>
  </section>
  <div id="toast" role="status"></div>
</div>
<script>/*@DATA@*/</script>
<script>/*@CORE@*/</script>
<script>/*@ENGINE@*/</script>
<script>/*@DAILY@*/</script>
<script>/*@STUDIO@*/</script>
<script>/*@KIT@*/</script>
<script>/*@STICKERS@*/</script>
<script>/*@RENDER@*/</script>
<script>/*@GAME@*/</script>
<script>/*@APP@*/</script>
</body>
</html>
