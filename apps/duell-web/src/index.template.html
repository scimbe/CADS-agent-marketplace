<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14102e">
<meta name="referrer" content="no-referrer">
<title>Duell</title>
<style>
:root{--sky:#4ec0ca;--ground:#ded895;--hot:linear-gradient(135deg,#ff3d71,#ff8a3d);--glass:rgba(16,12,38,.9);--ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font:600 16px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;background:var(--sky)}
#cv{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:block}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
#title{font-weight:800;font-size:15px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.35);padding-top:8px}
.mini{display:flex;gap:8px}
.mini button{width:44px;height:44px;border-radius:14px;border:0;background:rgba(16,12,38,.55);color:#fff;font:700 14px system-ui;cursor:pointer}
#hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);text-align:center;pointer-events:none}
#score{font-size:68px;font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.25);transform-origin:center;display:inline-block}
#score.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#bestchip{font-size:13px;opacity:.9;text-shadow:0 2px 0 rgba(0,0,0,.35);min-height:16px}
#banner{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 150px);background:var(--glass);border-radius:16px;padding:12px 14px;text-align:center;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none;animation:drop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
#hint{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:900;font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.btn{border:0;border-radius:18px;color:#fff;font:800 17px system-ui,-apple-system,sans-serif;min-height:52px;padding:0 18px;cursor:pointer;background:rgba(255,255,255,.14);transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.hot{background:var(--hot);box-shadow:0 6px 0 #a3153f,0 10px 24px rgba(255,61,113,.45);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.big{min-height:68px;font-size:22px;width:100%;border-radius:22px;letter-spacing:.2px}
#dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px}
#dock .btn{flex:1;background:var(--glass)}
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--glass);border-radius:28px 28px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,1.1,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.panel.show{transform:none}
#record{display:none;text-align:center;font-weight:900;font-size:22px;letter-spacing:1px;background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pulse .6s ease-in-out infinite alternate}
#record.show{display:block}
@keyframes pulse{to{transform:scale(1.12)}}
#res-score{text-align:center;font-size:76px;font-weight:900;line-height:1.05}
#res-line{text-align:center;opacity:.9;min-height:20px;margin:2px 0 12px}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{flex:1}
.field{width:100%;height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:600 16px system-ui;padding:0 14px;outline:0;user-select:text;-webkit-user-select:text}
.field:focus{border-color:#ff8a3d}
#name{margin-bottom:10px;height:42px;font-size:15px}
#chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.chip{border:0;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;padding:10px 2px 8px;font:700 12px system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.chip i{font-style:normal;font-size:26px}
.chip:active{background:rgba(255,255,255,.25)}
#note{font-size:12px;opacity:.65;margin:8px 2px 0;font-weight:500}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,20px);background:#fff;color:#14102e;border-radius:14px;padding:12px 16px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.sheetrow{display:flex;gap:8px}
.sheetrow .btn{min-width:84px}
#sheetclose{position:absolute;right:12px;top:10px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:18px}
@media (prefers-reduced-motion:reduce){#hint,#record,#banner{animation:none}.panel{transition:none}}
</style>
</head>
<body data-state="ready">
<div id="app">
  <canvas id="cv" aria-label="Spielfeld"></canvas>
  <div class="top">
    <div id="title"></div>
    <div class="mini"><button id="lang" aria-label="Sprache">DE</button><button id="mute" aria-label="Ton">&#128266;</button></div>
  </div>
  <div id="hud"><div id="score" data-score="0">0</div><div id="bestchip"></div></div>
  <div id="banner" hidden></div>
  <div id="hint"></div>
  <div id="dock">
    <button class="btn" id="daily"></button>
    <button class="btn" id="new"></button>
  </div>

  <div class="panel" id="result" aria-live="polite">
    <div id="record"></div>
    <div id="res-score">0</div>
    <div id="res-line"></div>
    <input class="field" id="name" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn hot big" id="challenge"></button>
    <div class="row"><button class="btn" id="again"></button><button class="btn" id="menu"></button></div>
  </div>

  <div class="panel" id="sheet">
    <button id="sheetclose" aria-label="Schliessen">&#10005;</button>
    <div id="sheet-h" style="font-weight:900;font-size:20px;margin-bottom:10px"></div>
    <div class="sheetrow"><input class="field" id="prompt" maxlength="80" autocomplete="off" enterkeyhint="go"><button class="btn hot" id="go"></button></div>
    <div id="chips"></div>
    <div id="note"></div>
  </div>
  <div id="toast" role="status"></div>
</div>
<script>
/*@CORE@*/
</script>
<script>
/*@ENGINE@*/
</script>
<script>
(function () {
"use strict";
var C = window.DuellCore, E = window.DuellEngine;

/* ---------- texts ---------- */

    record: "NEW RECORD!", best: "Your best: {n}", points: "points", namePh: "Your name (optional)",
    banner: "{name} has {n} - beat it!", rival: "Your rival", win: "Beat {name}. Nice.", tie: "Tied with {name}. Again!",

function fmt(s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o && o[k] != null ? o[k] : ""; }); }

var myName = C.sanitizeName(store.name || "");

/* ---------- themes ---------- */
var TH = {

  night: { skyTop: "#0b1030", skyBottom: "#26305e", pipe: "#3a6ea5", pipeEdge: "#20406a", ground: "#2b2b3a", groundEdge: "#4a4a63", accent: "#7ad1ff", stars: 1 },
  sunset:{ skyTop: "#ff9e57", skyBottom: "#ffd9a0", pipe: "#c0653a", pipeEdge: "#7d3b1b", ground: "#caa06a", groundEdge: "#a67c48", accent: "#ffef8f" },
  retro: { skyTop: "#9bbc0f", skyBottom: "#8bac0f", pipe: "#306230", pipeEdge: "#0f380f", ground: "#306230", groundEdge: "#0f380f", accent: "#e0f8d0" },
  candy: { skyTop: "#ff8fd0", skyBottom: "#ffd0ec", pipe: "#7a5cff", pipeEdge: "#4a2fb0", ground: "#ffc0e6", groundEdge: "#e59ccf", accent: "#fff2b0" },
  neon:  { skyTop: "#12002b", skyBottom: "#3a0a6b", pipe: "#00f5d4", pipeEdge: "#00a896", ground: "#1b0036", groundEdge: "#ff2bd6", accent: "#ff2bd6", glow: 1, stars: 1 },
  ocean: { skyTop: "#04476b", skyBottom: "#1aa6b7", pipe: "#ff7f6b", pipeEdge: "#b74a3a", ground: "#0b2f4a", groundEdge: "#1d5f86", accent: "#aef0ff", bubbles: 1 },
  lava:  { skyTop: "#2b0a0a", skyBottom: "#7a1d0b", pipe: "#3a3a3a", pipeEdge: "#1b1b1b", ground: "#1b0f0f", groundEdge: "#ff5a1f", accent: "#ffb347", glow: 1 }

var SFX = {
  flap: function () { tone(420, 760, 0.09, "square", 0.05); buzz(6); },
  score: function () { tone(880, 880, 0.08, "triangle", 0.12); tone(1320, 1320, 0.14, "triangle", 0.12, 0.07); buzz(14); },
  dead: function () { tone(260, 40, 0.45, "sawtooth", 0.16); tone(120, 30, 0.35, "square", 0.1, 0.03); buzz([70, 40, 160]); },
  record: function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, f, 0.16, "triangle", 0.13, i * 0.09); }); buzz([30, 40, 30, 40, 30, 40, 220]); },

/* ---------- app state ---------- */
var cur, rival = null, sim, rng, prevBest = 0, isRecord = false, recordShown = false, resultTimer = 0;
var reduce = false;

function setBodyState(s) { document.body.setAttribute("data-state", s); }
function toast(msg) {
  var el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 2400);
}
function bestFor(st) { var b = store.best[C.configKey(st)]; return typeof b === "number" ? b : 0; }

function applyTheme() {
  var th = TH[cur.theme];
  document.documentElement.style.setProperty("--sky", th.skyTop);
  document.documentElement.style.setProperty("--ground", th.ground);
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", th.skyTop);
}
function updateBanner() {
  var b = $("banner");
  if (rival && typeof rival.score === "number" && rival.name) {
    b.textContent = fmt(t("banner"), { name: rival.name, n: rival.score }); b.hidden = false;
  } else if (rival && typeof rival.score === "number") {
    b.textContent = fmt(t("banner"), { name: t("rival"), n: rival.score }); b.hidden = false;
  } else b.hidden = true;
}
function updateBestChip() { var b = bestFor(cur); $("bestchip").textContent = b ? fmt(t("best"), { n: b }) : ""; }

function newRun() {
  clearTimeout(resultTimer);
  rng = C.mulberry32(cur.seed);
  sim = E.createSim(cur.params, rng);
  prevBest = bestFor(cur); isRecord = false; recordShown = false;
  parts.length = 0; shake = 0; flash = 0; trail.length = 0; floaters.length = 0;
  setScore(0, false);
  $("result").classList.remove("show");
  $("hint").hidden = false; $("dock").hidden = false;

  updateBestChip();
}
function setScore(n, pop) {
  var s = $("score"); s.textContent = String(n); s.setAttribute("data-score", String(n));
  if (pop && !reduce) { s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop"); }
}
function useState(st, riv, opts) {
  cur = st; rival = riv || null;
  $("title").textContent = cur.title;           // text only, never HTML
  applyTheme(); updateBanner();
  if (!opts || opts.hash !== false) {
    try { var h = "#c=" + C.encodeState(riv ? Object.assign({}, st, { score: riv.score, name: riv.name }) : st); history.replaceState(null, "", h); } catch (e) {}
  }

}
function rivalOf(st) { return typeof st.score === "number" ? { score: st.score, name: st.name || "" } : (st.name ? { name: st.name } : null); }
function stripRival(st) { var o = Object.assign({}, st); delete o.score; delete o.name; return o; }

function burst(x, y, n, colors, speed, grav) {

    var a = Math.random() * 6.283, v = (0.3 + Math.random()) * speed;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.2, life: 0.6 + Math.random() * 0.7, max: 1.3, c: colors[i % colors.length], s: 2 + Math.random() * 4, g: grav == null ? 600 : grav });

var CONF = ["#ff3d71", "#ffd93d", "#4ee1a0", "#4dabff", "#c77dff", "#fff"];
function doShake(a) { if (!reduce) shake = Math.max(shake, a); }

  cv.dpr = dpr;

function draw() {
  var th = TH[cur.theme], p = sim, s = scale * cv.dpr, W = E.W, H = E.H, G = E.GROUND;

  ctx.setTransform(s, 0, 0, s, sx * s, sy * s);

  else { ctx.fillStyle = "rgba(255,255,255,.35)"; for (i = 0; i < 4; i++) { x = ((i * 130 - clock * (6 + i * 3)) % (W + 120) + (W + 120)) % (W + 120) - 60; y = 70 + i * 62; ctx.beginPath(); ctx.ellipse(x, y, 34, 11, 0, 0, 7); ctx.ellipse(x + 20, y - 8, 22, 10, 0, 0, 7); ctx.fill(); } }

    if (th.glow) { ctx.shadowColor = th.pipe; ctx.shadowBlur = 12; }
    ctx.fillStyle = th.pipe; ctx.strokeStyle = th.pipeEdge; ctx.lineWidth = 2;
    ctx.fillRect(pp.x, 0, P, pp.top); ctx.strokeRect(pp.x + 1, 0, P - 2, pp.top);

    ctx.fillRect(pp.x, by, P, H - G - by); ctx.strokeRect(pp.x + 1, by, P - 2, H - G - by);
    ctx.fillRect(pp.x - 5, by, P + 10, cap); ctx.strokeRect(pp.x - 4, by + 1, P + 8, cap - 1);
    ctx.shadowBlur = 0;

  var off = p.state === "run" ? (p.ticks * p.params.speed * E.STEP) % 24 : 0;

  ctx.fillStyle = th.groundEdge; ctx.fillRect(0, H - G, W, 4);

  for (i = 0; i < trail.length; i++) { var tr = trail[i]; ctx.globalAlpha = tr.a * 0.5; ctx.fillStyle = th.accent; ctx.beginPath(); ctx.arc(tr.x, tr.y, 7 * tr.a, 0, 7); ctx.fill(); }

  // floating texts
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (i = 0; i < floaters.length; i++) { var f = floaters[i]; ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.font = "900 " + f.size + "px system-ui,sans-serif"; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.strokeText(f.t, f.x, f.y); ctx.fillStyle = f.c; ctx.fillText(f.t, f.x, f.y); }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = "rgba(255,60,80," + (flash * 0.5) + ")"; ctx.fillRect(-20, -20, W + 40, H + 40); }
}

/* ---------- loop ---------- */
var last = 0, acc = 0;
function handle(ev) {
  var b = sim.bird;
  for (var i = 0; i < ev.length; i++) {
    if (ev[i] === "score") {
      setScore(sim.score, true); SFX.score();
      burst(86, b.y, 10, CONF, 150, 300);
      floaters.push({ x: 86, y: b.y - 28, t: "+1", c: "#fff", size: 20, life: 0.8, vy: -50 });
      if (prevBest > 0 && sim.score > prevBest && !recordShown) {
        recordShown = true; floaters.push({ x: E.W / 2, y: 190, t: t("btnRec"), c: "#ffd93d", size: 34, life: 1.4, vy: -20 });
        burst(E.W / 2, 200, 40, CONF, 260, 260); SFX.record();
      }
    } else if (ev[i] === "dead") onDead();
  }
}
function onDead() {
  setBodyState("over"); SFX.dead(); doShake(18); flash = 1;
  burst(86, sim.bird.y, 46, [TH[cur.theme].accent, "#fff", "#ff3d71", "#ffd93d"], 320, 700);
  isRecord = sim.score > prevBest && sim.score > 0;
  if (isRecord) { store.best[C.configKey(cur)] = sim.score; save(); }
  $("hint").hidden = true; $("banner").hidden = true;
  resultTimer = setTimeout(showResult, 650);
}
function showResult() {
  var sc = sim.score, line = "";
  $("record").textContent = t("record"); $("record").classList.toggle("show", isRecord);
  if (isRecord) { burst(E.W / 2, 150, 90, CONF, 340, 280); SFX.record(); doShake(8); }
  if (rival && typeof rival.score === "number") {
    var nm = rival.name || t("rival");
    line = sc > rival.score ? fmt(t("win"), { name: nm }) : sc === rival.score ? fmt(t("tie"), { name: nm }) : fmt(t("lose"), { name: nm, d: rival.score - sc });
  } else line = fmt(t("best"), { n: Math.max(prevBest, sc) });
  $("res-line").textContent = line;
  $("name").value = myName;
  $("result").classList.add("show");
  var el = $("res-score"), t0 = performance.now(), dur = Math.min(700, 120 + sc * 40);
  (function tick(now) { var k = Math.min(1, (now - t0) / dur); el.textContent = String(Math.round(sc * k)); if (k < 1) requestAnimationFrame(tick); })(t0);
}
function frame(ts) {
  var dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; clock += dt;
  if (sim.state === "run") {
    acc += dt;
    while (acc >= E.STEP) { acc -= E.STEP; handle(sim.step()); if (sim.state !== "run") break; }
    if (sim.ticks % 3 === 0 && sim.state === "run") trail.push({ x: 86, y: sim.bird.y, a: 1 });
  } else acc = 0;
  for (var i = trail.length - 1; i >= 0; i--) { trail[i].x -= sim.params.speed * dt; trail[i].a -= dt * 2.4; if (trail[i].a <= 0) trail.splice(i, 1); }
  for (i = parts.length - 1; i >= 0; i--) { var q = parts[i]; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; if (q.life <= 0) parts.splice(i, 1); }
  for (i = floaters.length - 1; i >= 0; i--) { floaters[i].y += floaters[i].vy * dt; floaters[i].life -= dt; if (floaters[i].life <= 0) floaters.splice(i, 1); }
  shake = Math.max(0, shake - dt * 60); flash = Math.max(0, flash - dt * 2.5);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function anyOverlayOpen() { return $("sheet").classList.contains("show"); }
function doFlap() {
  if (sim.state === "over" || anyOverlayOpen()) return;
  var ev = sim.flap();
  if (ev.indexOf("start") >= 0) { setBodyState("run"); $("hint").hidden = true; $("dock").hidden = true; $("banner").hidden = true; }
  if (ev.indexOf("flap") >= 0) { SFX.flap(); burst(86 - 10, sim.bird.y + 8, 5, ["#fff", TH[cur.theme].accent], 90, 200); }
}
$("app").addEventListener("pointerdown", function (e) {
  if (e.target.closest("button,input,.panel,#banner")) return;
  e.preventDefault(); doFlap();
});
window.addEventListener("keydown", function (e) {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
    if (e.key === "Enter" && e.target.id === "prompt") submitPrompt();
    return;
  }
  if (e.code === "Space" || e.key === " " || e.key === "ArrowUp") { e.preventDefault(); doFlap(); }
});

/* ---------- sheet / new game ---------- */
function openSheet() { SFX.tap(); $("sheet").classList.add("show"); $("result").classList.remove("show"); }
function closeSheet() { $("sheet").classList.remove("show"); $("prompt").blur(); if (sim.state === "over") $("result").classList.add("show"); }
function pick(st) { closeSheet(); useState(st, null); }
function renderChips() {
  var box = $("chips"); box.textContent = "";
  C.PRESETS.forEach(function (p) {
    var b = document.createElement("button"); b.className = "chip"; b.type = "button";
    var i = document.createElement("i"); i.textContent = p.emoji;
    var s = document.createElement("span"); s.textContent = lang === "en" ? p.en : p.de;
    b.appendChild(i); b.appendChild(s);
    b.addEventListener("click", function () { SFX.tap(); pick(C.presetState(p, lang)); });
    box.appendChild(b);
  });
}
var busy = false;
async function submitPrompt() {
  if (busy) return;
  var raw = $("prompt").value, prompt = C.sanitizePrompt(raw);
  if (!prompt) { toast(t("empty")); return; }
  if (!C.isClean(prompt)) { toast(t("filter")); return; }
  busy = true; $("go").textContent = "..."; SFX.tap();
  var st = null;
  if (navigator.onLine !== false && typeof fetch === "function") {
    var ctl = typeof AbortController === "function" ? new AbortController() : null, tm = setTimeout(function () { if (ctl) ctl.abort(); }, 4000);
    try {
      var res = await fetch(window.DUELL_API || C.DEFAULT_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: prompt, lang: lang }), signal: ctl ? ctl.signal : undefined, credentials: "omit", referrerPolicy: "no-referrer" });
      if (res.ok) st = C.stateFromApi(await res.json(), prompt);
    } catch (e) { st = null; }
    clearTimeout(tm);
  }
  if (!st) { var lc = C.localConfig(prompt, lang); if (lc.rejected) { busy = false; $("go").textContent = t("go"); toast(t("filter")); return; } st = lc; }
  busy = false; $("go").textContent = t("go");
  $("prompt").value = ""; pick(st);
}
$("go").addEventListener("click", submitPrompt);
$("new").addEventListener("click", openSheet);
$("menu").addEventListener("click", openSheet);
$("sheetclose").addEventListener("click", closeSheet);
$("daily").addEventListener("click", function () { SFX.tap(); useState(C.dailyConfig(new Date(), lang), null); });
$("again").addEventListener("click", function () { SFX.tap(); newRun(); });

/* ---------- share ---------- */
function copyText(s) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s).then(function () { return true; }, function () { return legacyCopy(s); });
  return Promise.resolve(legacyCopy(s));
}
function legacyCopy(s) {
  try { var ta = document.createElement("textarea"); ta.value = s; ta.style.cssText = "position:fixed;opacity:0;top:0"; document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); ta.remove(); return ok; } catch (e) { return false; }
}
async function challenge() {
  SFX.tap();
  var nm = C.sanitizeName($("name").value); myName = nm; store.name = nm; save();
  var st = Object.assign({}, cur, { score: sim.score });
  if (nm) st.name = nm;
  var url = C.buildUrl(st);
  var text = fmt(t("share"), { who: nm ? nm + ": " : "", n: sim.score, t: cur.title });
  try {
    if (window.DuellHost && typeof window.DuellHost.share === "function") { await window.DuellHost.share(url, text); return; }
  } catch (e) { /* fall through */ }
  try {
    if (navigator.share) { await navigator.share({ text: text, url: url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  if (await copyText(text + " " + url)) toast(t("copied"));
  else { toast(t("shareFail")); try { window.prompt(t("shareFail"), url); } catch (e) {} }
}
$("challenge").addEventListener("click", challenge);
$("name").addEventListener("change", function () { myName = C.sanitizeName($("name").value); store.name = myName; save(); });

/* ---------- chrome ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  $("hint").textContent = t("hint"); $("daily").textContent = "📅 " + t("daily"); $("new").textContent = "✨ " + t("fresh");
  $("sheet-h").textContent = t("sheetH"); $("prompt").placeholder = t("ph"); $("go").textContent = t("go");
  $("challenge").textContent = t("challenge"); $("again").textContent = t("again"); $("menu").textContent = t("menu");
  $("name").placeholder = t("namePh"); $("note").textContent = t("note"); $("lang").textContent = lang.toUpperCase();
  $("mute").setAttribute("aria-label", t("sound")); $("record").textContent = t("record");
  renderChips(); if (cur) { updateBanner(); updateBestChip(); }
}
$("lang").addEventListener("click", function () {
  lang = lang === "de" ? "en" : "de"; store.lang = lang; save(); applyLang();
  if (cur && sim.state === "over") showResult();
});
function paintMute() { $("mute").textContent = muted ? "🔇" : "🔊"; }
$("mute").addEventListener("click", function () { muted = !muted; store.muted = muted; save(); paintMute(); if (!muted) SFX.tap(); });

window.addEventListener("hashchange", function () { var st = C.parseHash(location.hash); if (st) { $("sheet").classList.remove("show"); fromLink(st); } });
document.addEventListener("visibilitychange", function () { last = 0; });

/* test hook (read-only snapshot, used by browser checks) */
window.DuellDebug = { snap: function () {
  var nx = null; for (var i = 0; i < sim.pipes.length; i++) if (sim.pipes[i].x + E.PIPE_W >= 86 - 15) { nx = sim.pipes[i]; break; }
  return { state: sim.state, score: sim.score, y: sim.bird.y, vy: sim.bird.vy, next: nx ? { x: nx.x, top: nx.top, gap: sim.params.gap } : null, cfg: cur, rival: rival };
} };

/* ---------- go ---------- */
paintMute(); applyLang(); fit();
var first = C.parseHash(location.hash);
if (first) fromLink(first); else useState(C.dailyConfig(new Date(), lang), null);
requestAnimationFrame(frame);
})();
</script>
</body>
