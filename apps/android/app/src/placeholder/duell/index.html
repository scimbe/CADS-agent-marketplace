<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Duell (Platzhalter)</title>
<style>html,body{margin:0;height:100%;font:20px sans-serif;background:#222;color:#fff;text-align:center}
#area{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:16px;touch-action:manipulation}
#score{font-size:72px}</style></head>
<body data-state="ready" data-score="0">
<!-- Test placeholder only: same observable contract as apps/duell-web/dist/index.html
     (#score, #title, #banner, #c= fragment), replaced by the real file at build time. -->
<div id="area">
  <div id="title">Duell</div>
  <div id="banner"></div>
  <div id="score">0</div>
  <div>PLATZHALTER - tippen</div>
</div>
<script>
var n=0,b=document.body;
function show(){document.getElementById('score').textContent=n;b.dataset.score=n;}
document.getElementById('area').addEventListener('pointerdown',function(){n++;b.dataset.state='run';show();
  if(window.DuellHost&&window.DuellHost.haptic)window.DuellHost.haptic();});
function pad(s){return s+'==='.slice((s.length+3)%4)}
function load(){
  var m=/^#c=([A-Za-z0-9_-]+)$/.exec(location.hash);if(!m)return;
  try{var c=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(pad(m[1].replace(/-/g,'+').replace(/_/g,'/'))),function(x){return x.charCodeAt(0)})));
    document.getElementById('title').textContent=c.title||'Duell';
    if(c.name)document.getElementById('banner').textContent=c.name+' hat '+(c.score||0)+' Punkte - schlag das!';}catch(e){}
}
load();addEventListener('hashchange',load);
</script></body></html>
