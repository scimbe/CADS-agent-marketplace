name: duell-web

on:
  push:
    branches: [main]
    paths: ["apps/duell-web/**", ".github/workflows/duell-web.yml"]
  pull_request:
    paths: ["apps/duell-web/**", ".github/workflows/duell-web.yml"]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/duell-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned font package (@fontsource/anton, embedded into the page)
        run: npm ci --ignore-scripts
      - name: Unit tests (node --test)
        run: npm test
      - name: Build single-file dist/index.html
        run: npm run build
      - name: Two real editors in two browser contexts over a test transport
        env:
          COLLAB_SHOTS: ${{ github.workspace }}/collab-shots
        run: |
          mkdir -p "$COLLAB_SHOTS"
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collab-screenshots
          path: collab-shots
      - uses: actions/upload-artifact@v4
        with:
          name: duell-index-html
          path: apps/duell-web/dist/index.html
          if-no-files-found: error
