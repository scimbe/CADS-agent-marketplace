name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # bwrap itself for installer-engine's sandbox::bwrap tests/probe. `kernel.apparmor_restrict_
      # unprivileged_userns` (Ubuntu 24.04's default LSM restriction on unprivileged user-namespace
      # creation, which `ubuntu-latest` runner images carry) makes bwrap's real sandboxed-exec probe
      # fail even with bwrap installed and on PATH -- confirmed empirically against this exact
      # symptom during CADS-agent-marketplace#12's implementation (both `bwrap --unshare-user
      # --unshare-pid ...` and plain `unshare --user` failed with "Permission denied" on a dev host
      # carrying this same restriction, with no way to lift it short of root). Relaxing it here is
      # scoped to this ephemeral CI VM only, via passwordless sudo GitHub-hosted runners provide --
      # never do this on a shared, persistent host. Without this step, the real
      # sandboxed-activation integration test in activate.rs would (correctly) skip rather than
      # false-fail, but M1's actual isolation claim would then never be CI-verified for real.
      - name: Install bwrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build (-D warnings)
        run: cargo build --locked --all-targets

      - name: Test (-D warnings)
        run: cargo test --locked

      # InstallerKind::Wasm: build the real Rust example as a WASI 0.2 component and run it under the
      # runtime (JIT and Pulley). WASM_HELLO_REQUIRED=1 turns a missing component into a failure, so
      # these tests can never skip silently here (locally they skip when the target is absent).
      - name: Add wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Build examples/wasm-hello (wasm32-wasip2)
        run: scripts/build-wasm-hello.sh

      - name: Wasm example runs under the sandbox runtime (no skips)
        run: WASM_HELLO_REQUIRED=1 cargo test --locked -p installer-engine --test wasm_hello

      # The Linux escape tests must EXECUTE, not skip: with bwrap installed above and the userns
      # restriction relaxed, a "skipping" line means the sandbox silently did not run.
      - name: bwrap escape tests actually ran (no skips)
        run: |
          cargo test --locked -p installer-engine -- --nocapture --test-threads=1 \
            sandbox::bwrap::tests::real activate::tests::a_binary_manifest_is_genuinely_confined_by_bwrap 2>&1 | tee escape.log
          grep -q "test result: ok. 3 passed; 0 failed" escape.log   # all three executed and passed
          ! grep -q "skipping" escape.log

  # macOS: the `sandbox_exec` (Seatbelt) backend is real, so this job EXECUTES the escape tests
  # (sandbox::sandbox_exec::tests::real::*, activate's macOS confinement test): a write outside
  # work_dir and a TCP connect to a live loopback listener must both fail from inside the sandbox.
  # If macos-latest ever stops shipping /usr/bin/sandbox-exec (Apple deprecated it), the probe
  # reports Unavailable, those tests skip with a message, and the Seatbelt step below fails loudly
  # instead of letting the gap go unnoticed.
  gate-macos:
    runs-on: macos-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Build (-D warnings)
        run: cargo build --locked --all-targets

      - name: Test (-D warnings)
        run: cargo test --locked

      - name: Seatbelt must be usable here (no silent skips)
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true

  # Windows: compile + unit-test the WSL2/bwrap backend (path translation, argv, probe-failure
  # classification, doctor plans), which are pure and run on every OS, plus the platform-neutral
  # engine tests. The runner has no WSL distro, so the real wsl_bwrap isolation is NOT exercised
  # here (the runner has no distro, so the probe reports Unavailable with setup steps). The
  # shell-driven activation tests are `#[cfg(unix)]`. `continue-on-error` until a first run has
  # shown the remaining platform-neutral tests are green on Windows; then remove it.
  gate-windows:
    runs-on: windows-latest
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Test installer-engine
        run: cargo test --locked -p installer-engine

  # Measures what the other jobs cannot: manifest-core-wasm (the browser binding for ServiceManifest
  # and PromptTemplate sign/verify/render) actually builds for wasm32-unknown-unknown.
  wasm-build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build manifest-core-wasm for wasm32
        run: cargo build --locked -p manifest-core-wasm --target wasm32-unknown-unknown --release
