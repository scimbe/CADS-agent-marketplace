name: mobile

on:
  push:
    branches: [main]
    paths:
      - "crates/mobile-core/**"
      - "crates/manifest-core/**"
      - "apps/**"
      - "manifests/prompt-templates/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "crates/mobile-core/**"
      - "crates/manifest-core/**"
      - "apps/**"
      - "manifests/prompt-templates/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p mobile-core
      - run: cargo test -p mobile-core --features wasm

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4
      - name: Locate NDK and Android SDK from the runner image
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "using NDK $NDK"
      - name: Build Rust core + Kotlin bindings
        run: apps/android/build-rust.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Duell page (single offline HTML file bundled into the app)
        working-directory: apps/duell-web
        run: npm run build
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Unit tests + assembleDebug + assembleRelease (unsigned)
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cads-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
      # The release APK is signed outside CI with the maintainer's key (never stored in CI).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cads-release-unsigned-apk
          path: apps/android/app/build/outputs/apk/release/*.apk

  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cads-release-unsigned-apk
          path: apk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sign a copy with a throw-away key (only so the emulator accepts it)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/ci.jks"; PW=$(openssl rand -hex 16); echo "::add-mask::$PW"
          keytool -genkeypair -keystore "$KS" -storepass "$PW" -keypass "$PW" -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=ci-only" >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PW" --out "$RUNNER_TEMP/cads-ci-signed.apk" apk/*.apk
          "$BT/apksigner" verify "$RUNNER_TEMP/cads-ci-signed.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator and check the offline screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: apps/android/emulator-smoke.sh ${{ runner.temp }}/cads-ci-signed.apk emulator-shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-screenshots
          path: emulator-shots/*.png

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install XcodeGen 2.46.0 (pinned, checksum verified)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build Rust core XCFramework + Swift bindings
        run: apps/ios/build-rust.sh
      - name: Generate Xcode project and build for the iOS simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project CadsMarketplace.xcodeproj -scheme CadsMarketplace \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build build
      - name: Run in the simulator and capture the three screens (mock data, DEBUG build)
        working-directory: apps/ios
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/CadsMarketplace.app
          mkdir -p shots
          xcrun simctl launch "$UDID" org.bunsenbrenner.cads -UIMockInstallations -UITab 0
          sleep 4; xcrun simctl io "$UDID" screenshot shots/1-vorlagen.png
          xcrun simctl terminate "$UDID" org.bunsenbrenner.cads
          xcrun simctl launch "$UDID" org.bunsenbrenner.cads -UIMockInstallations -UITab 1
          sleep 4; xcrun simctl io "$UDID" screenshot shots/2-installationen.png
          xcrun simctl terminate "$UDID" org.bunsenbrenner.cads
          xcrun simctl launch "$UDID" org.bunsenbrenner.cads -UIMockInstallations -UITab 2
          sleep 4; xcrun simctl io "$UDID" screenshot shots/3-vorlage-detail.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-screenshots
          path: apps/ios/shots/*.png
