name: mobile

on:
  push:
    branches: [main]
    paths:
      - "crates/mobile-core/**"
      - "crates/manifest-core/**"
      - "apps/**"
      - "manifests/prompt-templates/**"
      - "scripts/peer-e2e.sh"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "crates/mobile-core/**"
      - "crates/manifest-core/**"
      - "apps/**"
      - "manifests/prompt-templates/**"
      - "scripts/peer-e2e.sh"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p mobile-core
      - run: cargo test -p mobile-core --features wasm

  # Phone-to-phone channels (docs/adr/0004): two peer-demo processes against the real edge and
  # control plane, built from a pinned CADS-Tunnel commit. Nothing leaves the runner.
  peer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
      TUNNEL_REV: e8a6dd0d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p mobile-core --features peer
      - run: cargo build -p mobile-core --features peer --bin peer-demo
      - name: The feature cross-compiles for Android
        run: |
          cargo install cargo-ndk --locked --version 3.5.4
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          cargo ndk -t arm64-v8a build -p mobile-core --features peer --lib
      - name: Kotlin and Swift bindings generate with the feature on
        run: |
          cargo build -p mobile-core --features peer --lib
          cargo run -p mobile-core --features cli,peer --bin uniffi-bindgen -- generate --library target/debug/libmobile_core.so --language kotlin --out-dir /tmp/peer-kt
          cargo run -p mobile-core --features cli,peer --bin uniffi-bindgen -- generate --library target/debug/libmobile_core.so --language swift --out-dir /tmp/peer-swift
          grep -rq peerCreateInvite /tmp/peer-kt
      - uses: actions/cache@v4
        id: tunnel-bins
        with:
          path: tunnel-bin
          key: tunnel-bin-${{ env.TUNNEL_REV }}
      - name: Build edge and control plane
        if: steps.tunnel-bins.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: ""
        run: |
          git clone --quiet https://github.com/scimbe/CADS-Tunnel /tmp/tunnel
          git -C /tmp/tunnel checkout --quiet "$TUNNEL_REV"
          cargo build --manifest-path /tmp/tunnel/Cargo.toml --locked -p ct-edge -p ct-control-plane
          mkdir -p tunnel-bin
          cp /tmp/tunnel/target/debug/ct-edge /tmp/tunnel/target/debug/ct-control-plane tunnel-bin/
      - name: End-to-end proof
        env:
          CT_EDGE_BIN: tunnel-bin/ct-edge
          CT_CP_BIN: tunnel-bin/ct-control-plane
          PEER_DEMO_BIN: target/debug/peer-demo
        run: scripts/peer-e2e.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4
      - name: Locate NDK and Android SDK from the runner image
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "using NDK $NDK"
      - name: Build Rust core + Kotlin bindings
        run: apps/android/build-rust.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Duell page (single offline HTML file bundled into the app)
        working-directory: apps/duell-web
        run: npm run build
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Unit tests + assembleDebug + assembleRelease (unsigned)
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cads-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
      # The release APK is signed outside CI with the maintainer's key (never stored in CI).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cads-release-unsigned-apk
          path: apps/android/app/build/outputs/apk/release/*.apk

  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cads-release-unsigned-apk
          path: apk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sign a copy with a throw-away key (only so the emulator accepts it)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/ci.jks"; PW=$(openssl rand -hex 16); echo "::add-mask::$PW"
          keytool -genkeypair -keystore "$KS" -storepass "$PW" -keypass "$PW" -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=ci-only" >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PW" --out "$RUNNER_TEMP/cads-ci-signed.apk" apk/*.apk
          "$BT/apksigner" verify "$RUNNER_TEMP/cads-ci-signed.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator and check the offline screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: apps/android/emulator-smoke.sh ${{ runner.temp }}/cads-ci-signed.apk emulator-shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-screenshots
          path: emulator-shots/*.png

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install XcodeGen 2.46.0 (pinned, checksum verified)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build the Duell web game (apps/duell-web/dist/index.html, bundled into the app)
        working-directory: apps/duell-web
        run: npm run build
      - name: Build Rust core XCFramework + Swift bindings
        run: apps/ios/build-rust.sh
      - name: The peer feature compiles for iOS
        run: cargo check -p mobile-core --features peer --lib --target aarch64-apple-ios
      - name: Generate Xcode project and build for the iOS simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project CadsMarketplace.xcodeproj -scheme CadsMarketplace \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build build
      - name: Run in the simulator, capture the screens and check the Duell game (mock data, DEBUG build)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          APP=org.bunsenbrenner.cads
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/CadsMarketplace.app
          mkdir -p shots
          shot() { # name, extra launch args...
            local name=$1; shift
            local rep; rep="$(xcrun simctl get_app_container "$UDID" $APP data)/Documents/duell-report.json"
            rm -f "$rep"
            xcrun simctl launch "$UDID" $APP -UIMockInstallations "$@"
            if [[ " $* " == *" -DuellReport "* ]]; then
              # cold WebKit start on a fresh simulator can take a while: wait for the report file
              for _ in $(seq 1 60); do [ -f "$rep" ] && break; sleep 1; done
              sleep 2
              [ -f "$rep" ] && cp "$rep" "shots/report-$name.json"
            else
              sleep 6
            fi
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
            xcrun simctl terminate "$UDID" $APP
          }
          # Tabs: 0 Duell (default), 1 Vorlagen, 2 Installationen, 3 Vorlage-Detail
          shot 1-duell -UITab 0 -DuellReport
          CH=$(node -e "const C=require('./../duell-web/src/core.js');process.stdout.write(C.encodeState({v:1,name:'Mira-Test',score:7}))")
          shot 2-duell-challenge -UITab 0 -DuellChallenge "c=$CH" -DuellReport
          shot 3-vorlagen -UITab 1
          shot 4-installationen -UITab 2
          shot 5-vorlage-detail -UITab 3
          python3 - "$CH" <<'PY'
          import json, sys
          ch = sys.argv[1]
          start = json.load(open("shots/report-1-duell.json"))
          chal = json.load(open("shots/report-2-duell-challenge.json"))
          assert start["bundledPage"], "bundled duell/index.html missing"
          b, a = json.loads(start["before"]), json.loads(start["after"])
          assert b["hash"] != "#c=" + ch, "start without challenge must not show the test challenge"
          assert start["clicked"], "no button found in the game"
          assert b["text"] != a["text"], "game did not react to the click"
          cb = json.loads(chal["before"])
          assert cb["hash"] == "#c=" + ch, f"challenge fragment not taken over: {cb['hash']!r}"
          assert cb["href"].startswith("file://") and cb["href"].endswith("duell/index.html#c=" + ch)
          assert "PLATZHALTER" not in b["text"], "placeholder bundled instead of the real game"
          assert "Mira-Test" in cb["text"] and "7" in cb["text"], f"challenge content not shown: {cb['text']!r}"
          print("challenge banner:", cb["text"].strip().splitlines()[:6])
          print("duell checks ok; clicked:", start["clicked"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: |
            apps/ios/shots/*.png
            apps/ios/shots/*.json
