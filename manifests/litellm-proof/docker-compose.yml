# Isolated structural reproduction of the litellm-proxy stack, used only to prove the
# manifest installer end to end. It shares no name, network, volume, or port with the real
# deployment at /home/becke/git/litellm-proxy.
#
# No `name:` here on purpose: the compose project name is supplied at runtime by the
# installer (`docker compose -p <project>`), which may append a unique suffix. That also
# makes every container name project-scoped (`<project>-<service>-1`), so no
# `container_name:` is pinned either -- a pinned name would collide between two installs
# and would not match the installer's own `--filter name=<project>` lookups.
#
# Hardening (scimbe/ct-agent#183 phase 1, strict guardrail scan in
# crates/installer-engine/src/guardrails.rs): this file must pass the installer's
# fail-closed scan unchanged, and `guardrails.rs` carries a test that scans exactly this
# file so a regression here fails `cargo test`, not an install.
#   F.8   every `build:` uses the mapping form with `network: none` -- the Dockerfile's RUN
#         steps run inside the Docker daemon where ct-agent cannot sandbox them, so the
#         build gets no network at all (hence the stdlib-only sidecar).
#   F.15  every `image:` is pinned by digest, so the bytes that run are the bytes the
#         manifest was signed against, not whatever the mutable tag points at today.
#         Digests resolved 2026-09-07; refresh with
#           docker buildx imagetools inspect <image:tag>
#         and replace the `@sha256:...` suffix (keep the tag in front for readability).
#   F.16  every service: read-only rootfs, all capabilities dropped, no-new-privileges, a
#         pid bound and a memory bound. Writable scratch a read-only rootfs still needs is
#         given explicitly as `tmpfs:` (RAM-backed, per container, gone on restart);
#         persistent state stays on the named volumes. tmpfs pages are charged to the
#         container's memory cgroup, so each has a `size=` well inside its `mem_limit`.

networks:
  litellm-proof-internal:
    driver: bridge

volumes:
  litellm-proof-pgdata:
  litellm-proof-redisdata:

services:
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    # The image's `redis` account is uid 999 / gid 1000 (`addgroup -g 1000 redis; adduser
    # -u 999 -G redis`). Starting as that user skips the root->su-exec drop in the image's
    # entrypoint, which would need CAP_SETUID/SETGID we no longer grant. `/data` in the
    # image is owned by 999, and a fresh named volume inherits that ownership.
    user: "999:1000"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:size=16m
    volumes:
      - litellm-proof-redisdata:/data
    networks:
      - litellm-proof-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    # uid/gid 70 is the alpine image's `postgres` account. As root, the image's entrypoint
    # would chown the data dir and drop to postgres via gosu -- both need capabilities that
    # `cap_drop: [ALL]` removes. Started as 70 it skips that branch and runs initdb
    # directly; the image ships /var/lib/postgresql/data owned by 70 with mode 1777, and a
    # fresh named volume inherits that, so first-run initdb can write it without a chown.
    user: "70:70"
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm_proof_db
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # One backend process per connection (default max_connections=100) plus background
    # workers, checkpointer, walwriter, autovacuum: 256 leaves headroom, 64 would not.
    pids_limit: 256
    mem_limit: 512m
    tmpfs:
      # unix socket + lock file the server and pg_isready (healthcheck) rendezvous on
      - /var/run/postgresql:size=8m
      - /tmp:size=64m
    volumes:
      - litellm-proof-pgdata:/var/lib/postgresql/data
    networks:
      - litellm-proof-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm_proof_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest@sha256:32c04b00bc1a720e6d5eeb56a7e72f4e1e7d1e538e779c59b990cbddfd5e27da
    restart: unless-stopped
    # `user:` deliberately unset. This image (the plain `litellm`, not `litellm-non_root`)
    # declares no USER and its entrypoint (`docker/prod_entrypoint.sh` -> `exec litellm`)
    # does no privilege drop, so it runs as uid 0 -- but with every capability dropped
    # and no-new-privileges, which is the bound that matters here. Switching to a
    # numeric non-root uid would additionally need the prisma engine cache under
    # /root/.cache (populated at image build) to be readable by that uid; verify before
    # changing.
    ports:
      - "127.0.0.1:4103:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      - STORE_MODEL_IN_DB=True
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm_proof_db
      - LITELLM_SETTINGS=/app/config.yaml
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=admin
      - UI_PASSWORD=${LITELLM_MASTER_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # prisma's node CLI phones home / writes a checkpoint file unless told not to; on a
      # read-only rootfs that is one write attempt fewer to worry about.
      - CHECKPOINT_DISABLE=1
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # uvicorn worker threads + the prisma node CLI and query engine it spawns at startup;
    # every thread counts against pids_limit.
    pids_limit: 512
    mem_limit: 1g
    # ASSUMPTION (verify with a real `docker compose up`): the only path this image writes
    # at runtime is /tmp. Startup with DATABASE_URL set runs `prisma db push` from the
    # litellm package dir; the schema push itself only talks to postgres, and the prisma
    # engines it needs were downloaded into /root/.cache/prisma-python at image build and
    # are read, not written. The generator step that `db push` runs afterwards tries to
    # rewrite the already-generated client under site-packages/prisma; on a read-only
    # rootfs that write fails AFTER the tables exist, and the client baked in at build
    # time is the one the proxy imports. If startup breaks on a specific path instead,
    # add it here as a further tmpfs (candidates in order of likelihood:
    # /root/.cache, /app, the site-packages/prisma directory) rather than dropping
    # read_only.
    tmpfs:
      - /tmp:size=256m
    networks:
      - litellm-proof-internal
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  heartbeat:
    build:
      context: ./heartbeat-proxy
      network: none
    restart: unless-stopped
    ports:
      - "127.0.0.1:4101:8080"
    environment:
      - LITELLM_UPSTREAM=http://litellm:4000
      - PING_INTERVAL_SECONDS=7
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # ThreadingHTTPServer: one thread per open client connection, plus one ping thread per
    # in-flight streaming request. 128 is ample for a proof stack.
    pids_limit: 128
    mem_limit: 128m
    # The sidecar itself writes nothing (PYTHONDONTWRITEBYTECODE, no files); /tmp is only
    # there so the interpreter's tempfile fallbacks have somewhere to go.
    tmpfs:
      - /tmp:size=16m
    networks:
      - litellm-proof-internal
    depends_on:
      - litellm
