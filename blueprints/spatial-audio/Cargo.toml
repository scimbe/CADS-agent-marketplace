[package]
name = "bp-spatial-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Blueprint: spatial voice for very large virtual events (interest-managed forwarding, cell and sector beds, on-device binaural rendering)"

[features]
default = ["opus"]
# libopus (bundled C source, built with cmake): the real codec. Without it the crate builds with an
# uncompressed stand-in, which is only good for tests of everything but the codec cost.
opus = ["dep:opus"]

[dependencies]
opus = { version = "0.3", optional = true }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
