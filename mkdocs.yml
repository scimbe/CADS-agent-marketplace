site_name: CADS Agent Marketplace
site_description: Signed service manifests + installer for ct-agent
site_url: https://scimbe.github.io/CADS-agent-marketplace/
repo_url: https://github.com/scimbe/CADS-agent-marketplace
repo_name: scimbe/CADS-agent-marketplace
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search

nav:
  - Home: index.md
  - Security model: security-model.md
  - Design:
      - Composition manifest (multi-agent topologies): design/composition-manifest.md
      - Sandbox fallback (Binary installer): design/sandbox-fallback.md
  - ADRs:
      - "ADR-0001: manifest signing": adr/0001-manifest-signing.md
