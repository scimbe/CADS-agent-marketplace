[package]
name = "installer-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fetch/verify/unpack/guardrail-scan/compose-run/report engine for a ServiceManifest (Phase 1: compose installer_kind only)."

[dependencies]
manifest-core = { path = "../manifest-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Only needed to construct a real, signed ServiceManifest fixture for the Binary-executor
# integration tests in activate.rs -- installer-engine itself never signs anything.
ed25519-dalek = "2"
rand = "0.8"
