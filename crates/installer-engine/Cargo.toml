[package]
name = "installer-engine"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fetch/verify/unpack/guardrail-scan/compose-run/report engine for a ServiceManifest (Phase 1: compose installer_kind only)."

# MSRV: the crate itself builds on Rust 1.85. The `wasm` feature (default ON for this workspace's own
# builds) pulls wasmtime 50, which needs Rust >= 1.97 -- cargo cannot express a per-feature
# rust-version, so consumers on an older toolchain MUST depend with `default-features = false`
# (as `registry` and `harness-core` do, and as ct-agent should when it bumps this dependency).

[features]
# `wasm`: the WebAssembly installer kind (wasmtime component model + WASI 0.2). Default on for
# desktop; a mobile binding that wants a smaller binary can build with
# `default-features = false, features = ["wasm"]` (no wasi:http / TLS stack) or without `wasm`
# at all, in which case `InstallerKind::Wasm` manifests are refused with a clear reason.
default = ["wasm", "wasm-http"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:tokio"]
# `wasm-http`: link wasi:http (outgoing requests) when a manifest grants `allowed_http_hosts`.
wasm-http = ["wasm", "dep:wasmtime-wasi-http", "dep:http", "dep:http-body-util"]

[dependencies]
manifest-core = { path = "../manifest-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
libc = "0.2"
# Pinned exactly: the wasmtime embedding API (Linker/WasiView/hooks) changes between majors.
wasmtime = { version = "=50.0.0", default-features = false, features = ["runtime", "component-model", "cranelift", "pulley", "async", "std"], optional = true }
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p2"], optional = true }
wasmtime-wasi-http = { version = "=50.0.0", default-features = false, features = ["p2", "default-send-request"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "time"], optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
wat = "1"
bytes = "1"
tempfile = "3"
# Only needed to construct a real, signed ServiceManifest fixture for the Binary-executor
# integration tests in activate.rs -- installer-engine itself never signs anything.
ed25519-dalek = "2"
rand = "0.8"
