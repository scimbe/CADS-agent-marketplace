[package]
name = "harness-core"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Phase 2: a bounded, containment-checked, local-LLM-backed agent loop that maintains ONE manifest-installed bundle's own files."

[dependencies]
manifest-core = { path = "../manifest-core" }
installer-engine = { path = "../installer-engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Test-only escape hatch: lets integration tests run fake CLIs without an OS sandbox. Never enabled
# by ct-agent; without it every CLI run fails closed when no sandbox backend is available.
test-unsandboxed = []

[dev-dependencies]
harness-core = { path = ".", features = ["test-unsandboxed"] }
ed25519-dalek = "2"
