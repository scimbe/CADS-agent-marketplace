[package]
name = "manifest-core"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Signed ServiceManifest schema for CADS-agent-marketplace Phase 1 -- no I/O, no docker, pure data + crypto."

[dependencies]
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1.1.0"

[dev-dependencies]
rand = "0.8"
